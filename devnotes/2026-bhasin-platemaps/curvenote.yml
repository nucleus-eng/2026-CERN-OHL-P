  # would otherwise render as a stray "Text(43.5, 0.5, ...)" string above the
  # figure. Dropping it here avoids editing the author's code cell.
  settings:
    output_matplotlib_strings: remove
  exports:
    - format: meca
      id: meca
    - format: typst
      template: https://github.com/curvenote-templates/bnext.git
      article: main.md
      output: platemaps.pdf
      id: article
  requirements:
    - environment.yml
  resources:
    - src/**/*
    - assets/**/*
  downloads:
    - id: article
      title: Download Article PDF
    - id: meca
      title: Computational Archive
      filename: platemaps.zip
site:
  template: article-theme
