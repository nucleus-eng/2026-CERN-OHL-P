  license: CC-BY-4.0
  open_access: true
  venue: Nucleus
  subject: Developer Note
  plugins:
    - lorem.mjs
  jupyter: true
  # No typst export. main.md wraps its "Kinetic Fits" tab-set in
  # `:::{admonition}` with a custom title (line 218). The bnext Typst template
  # reports "Unknown admonition kind", drops the block, and the two figure
  # labels inside it go with it, so `{ref}`Group1-kineticfit`` and
  # `Group2-kineticfit` dangle and the PDF never builds. Deleting the
  # admonition wrapper and keeping the bare tab-set would fix it — the other
  # five tab-sets in this file are unwrapped — but that removes the collapsible
  # "Kinetic Fits" heading, which is the authors' layout. See
  # devnote-migration-status.md.
  exports:
    - format: meca
      id: meca
  requirements:
    - environment.yml
  resources:
    - general/**/*
    - experiments/**/*
    - src/**/*
  downloads:
    - id: meca
      title: Computational Archive
      filename: devcells-kickoff.zip
    - file: experiments/workshop-protocols.pdf
      title: Workshop Protocols
    - file: experiments/BOM Kickoff.pdf
      title: Bill of Materials
