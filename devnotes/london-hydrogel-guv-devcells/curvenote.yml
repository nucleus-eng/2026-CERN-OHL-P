  title: Hydrogel-Embedded GUV Developer Cells
  subtitle: Hydrogel embedded lipid-based GUVs for stable encapsulation and functional protein expression
  description: This module creates hydrogel-embedded, lipid-based GUV “developer cells” that can stably
    encapsulate a cell-free expression system and produce functional proteins. It provides a foundational
    synthetic-cell chassis for building spatially organised signalling and functional modules
