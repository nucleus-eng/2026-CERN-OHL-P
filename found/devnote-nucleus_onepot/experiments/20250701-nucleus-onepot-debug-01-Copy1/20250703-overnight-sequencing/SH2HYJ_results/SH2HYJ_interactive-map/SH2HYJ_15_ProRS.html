ction"},{"attributes":{"data":{"Description":["Protein evidence at protein level: Swiss-Prot protein existence level 1. Catalyzes the attachment of proline to tRNA(Pro) in a two-step reaction: proline is first activated by ATP to form Pro-AMP and then transferred to the acceptor end of tRNA(Pro). As ProRS can inadvertently accommodate and process non-cognate amino acids such as alanine and cysteine, to avoid such errors it has two additional distinct editing activities against alanine. One activity is designated as 'pretransfer' editing and involves the tRNA(Pro)-independent hydrolysis of activated Ala-AMP. The other activity is designated 'posttransfer' editing and involves deacylation of mischarged Ala-tRNA(Pro). Misacylated Cys-tRNA(Pro) is not edited by ProRS, but instead may be edited in trans by YbaK. From Escherichia coli (strain K12).","f1 bacteriophage origin of replication; arrow indicates direction of (+) strand synthesis ","transcription terminator for bacteriophage T7 RNA polymerase","bla","solubility-enhancement tag derived from T7 phage gene 10B"],"Feature":["SYP_ECOLI","f1 ori","T7 terminator","AmpR promoter","SET1"],"Lx1":{"__ndarray__":"74qEFXLaxb/0HxUlSrTLv8esL/cyjs2/Im11VINlx7+ul65g4MPNvw==","dtype":"float64","order":"little","shape":[5]},"Ly1":{"__ndarray__":"MrUQVKl7xL+TcyuQocS2P0ghs088bqM/T8WYjm+zwj+Dis8hPbmaPw==","dtype":"float64","order":"little","shape":[5]},"Type":["CDS","origin of replication","terminator","promoter","CDS"],"abs percmatch":{"__ndarray__":"AAAAAAAAWUAAAAAAAABZQAAAAAAAAFlAUsl5WcQnTEB2Xdd1XddDQA==","dtype":"float64","order":"little","shape":[5]},"annoLineColor":["#479f71","#4e7fff","#C97064","#f6a35e","#479f71"],"color":["green","blue","black","orange","green"],"db":["swissprot","snapgene","snapgene","snapgene","snapgene"],"evalue":{"__ndarray__":"AAAAAAAAAAAAAAAAAAAAAPSBL8B1Zg48FhCmuykt0TrdGZgQ6SrPOw==","dtype":"float64","order":"little","shape":[5]},"fill_color":["#479f71","#4e7fff","#C97064","#ffffff","#ffffff"],"fragment
