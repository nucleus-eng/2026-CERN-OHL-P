  requirements:
    - environment.yml
  resources:
    - src/**/*
    - figures/**/*
    - general/**/*
    - General/**/*
    - experiments/**/*
    - Experiments/**/*
    - resources/**/*
    - Resources/**/*
    - plasmids/**/*
    - Plasmids/**/*
  plugins:
    - type: javascript
      path: ./lorem.mjs
site:
  nav: []
  template: article-theme
  title: 'Meta DevNote: a DevNote about creating DevNotes'
  options:
    logo_text: 'Meta DevNote: a DevNote about creating DevNotes'
  actions:
