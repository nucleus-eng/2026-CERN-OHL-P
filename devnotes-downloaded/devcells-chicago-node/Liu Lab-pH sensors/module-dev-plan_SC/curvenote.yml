          - name: Mechanical Engineering Department, University of Michigan, Ann Arbor, Michigan, 48103, USA
            city: Ann Arbor
            state: Michigan
            postal_code: '48103'
            country: USA
  date: '2025-12-12'
  open_access: true
  license: CC-BY-4.0
  subject: Developer Note
  abbreviations:
    MyST: Markedly Structured Text
    CDK: cell development kit
  exports:
    - format: meca
    - format: typst
