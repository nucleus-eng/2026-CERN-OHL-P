    DevCell-based sensor for colorimetric detection of acidic pH.
  subtitle: 'DevCell-based sensor for colorimetric detection of acidic pH.'
  banner: devcells.webp
  venue:
    title: Nucleus
  github: https://github.com/bnext-bio/nucleus-developer-notes
  keywords:
   - DevCells
   - Modules
    - pH-responsive
    
  authors:
      - name: Samuel J. Chen
        orcid: 0000-0001-8501-7175
