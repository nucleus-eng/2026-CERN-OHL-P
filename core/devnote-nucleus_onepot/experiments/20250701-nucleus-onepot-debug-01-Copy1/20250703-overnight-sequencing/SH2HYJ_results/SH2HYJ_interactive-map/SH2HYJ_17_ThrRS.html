 evidence at protein level: Swiss-Prot protein existence level 1. Catalyzes the attachment of threonine to tRNA(Thr) in a two-step reaction: L-threonine is first activated by ATP to form Thr-AMP and then transferred to the acceptor end of tRNA(Thr) (PubMed:10881191, PubMed:15079065, PubMed:18997014). The rate-limiting step is amino acid activation in the presence of tRNA (PubMed:18997014). The 2'-OH of the acceptor base (adenine 76, A76) of tRNA(Thr) and His-309 collaborate to transfer L-Thr to the tRNA; substitution of 2'-OH of A76 with hydrogen or fluorine decreases transfer efficiency 760 and 100-fold respectively (PubMed:18997014). The zinc ion in the active site discriminates against charging of the isosteric amino acid valine (PubMed:10881191). Also activates L-serine, but does not detectably transfer it to tRNA(Thr) (PubMed:15079065). Edits incorrectly charged L-seryl-tRNA(Thr) via its editing domain (PubMed:15079065, PubMed:11136973, PubMed:15525511), in a post-transfer reaction probably via water-mediated hydrolysis (PubMed:15525511). From Escherichia coli (strain K12).","f1 bacteriophage origin of replication; arrow indicates direction of (+) strand synthesis ","transcription terminator for bacteriophage T7 RNA polymerase","bla","solubility-enhancement tag derived from T7 phage gene 10B"],"Feature":["SYT_ECOLI","f1 ori","T7 terminator","AmpR promoter","SET1"],"Lx1":{"__ndarray__":"BcAv7Hz1xb9aWEL2yEnLv9m3XbShU82/YGBZZ//jxr+6zkmgs5fNvw==","dtype":"float64","order":"little","shape":[5]},"Ly1":{"__ndarray__":"J1rx/ahexL+1Ey43OLK4P91jHJ5zWqg/R7hlTx9Rwz8vKsLDLIGiPw==","dtype":"float64","order":"little","shape":[5]},"Type":["CDS","origin of replication","terminator","promoter","CDS"],"abs percmatch":{"__ndarray__":"AAAAAAAAWUAAAAAAAABZQAAAAAAAAFlAUsl5WcQnTEB2Xdd1XddDQA==","dtype":"float64","order":"little","shape":[5]},"annoLineColor":["#479f71","#4e7fff","#C97064","#f6a35e","#479f71"],"color":["green","blue","black","orange","green"],"db":["swissprot","snapgene
